<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0a0a15" />
<title>盲打练习 · Touch Typing</title>
<style>
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

:root {
  --bg-0: #07070f;
  --bg-1: #0c0c1a;
  --glass: rgba(255, 255, 255, 0.045);
  --glass-hi: rgba(255, 255, 255, 0.09);
  --stroke: rgba(255, 255, 255, 0.09);
  --stroke-hi: rgba(255, 255, 255, 0.22);
  --text: #eef0f8;
  --text-2: #a3a6bf;
  --text-3: #6b6e88;
  --violet: #a78bfa;
  --teal: #5eead4;
  --pink: #f472b6;
  --lime: #c9f75a;
  --ok: #4ade80;
  --err: #f87171;
  --warn: #fbbf24;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-b: cubic-bezier(.34, 1.56, .64, 1);
  --ease-i: cubic-bezier(.4, 0, .2, 1);
  --r-lg: 24px;
  --r-md: 16px;
  --r-sm: 10px;
}

[data-theme="light"] {
  --bg-0: #f4f4ee;
  --bg-1: #eeeee6;
  --glass: rgba(0, 0, 0, 0.03);
  --glass-hi: rgba(0, 0, 0, 0.06);
  --stroke: rgba(0, 0, 0, 0.09);
  --stroke-hi: rgba(0, 0, 0, 0.22);
  --text: #14151f;
  --text-2: #555770;
  --text-3: #8d8fa3;
  --violet: #7c3aed;
  --teal: #0d9488;
  --pink: #db2777;
  --lime: #65a30d;
  --ok: #16a34a;
  --err: #dc2626;
  --warn: #d97706;
}

html, body {
  min-height: 100%;
}

body {
  font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont,
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               system-ui, sans-serif;
  background: var(--bg-0);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background .6s var(--ease), color .6s var(--ease);
}

button {
  font-family: inherit;
  color: inherit;
  border: none;
  background: none;
  cursor: pointer;
  outline: none;
}

input {
  font-family: inherit;
}

::selection {
  background: var(--violet);
  color: #fff;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--stroke-hi);
  border-radius: 99px;
  border: 3px solid var(--bg-0);
  transition: background .3s;
}
::-webkit-scrollbar-thumb:hover { background: var(--violet); }

.bg-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -2;
  overflow: hidden;
}

.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .34;
  will-change: transform;
}

[data-theme="light"] .bg-orb { opacity: .16; }

.orb-a {
  width: 540px; height: 540px;
  background: radial-gradient(circle, #a78bfa, transparent 68%);
  top: -180px; left: -140px;
  animation: drift-a 24s ease-in-out infinite;
}

.orb-b {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #5eead4, transparent 68%);
  top: 18%; right: -180px;
  animation: drift-b 28s ease-in-out infinite;
}

.orb-c {
  width: 460px; height: 460px;
  background: radial-gradient(circle, #f472b6, transparent 68%);
  bottom: -200px; left: 30%;
  animation: drift-c 26s ease-in-out infinite;
}

@keyframes drift-a {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(80px, -70px) scale(1.15); }
}
@keyframes drift-b {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-70px, 60px) scale(.9); }
}
@keyframes drift-c {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(60px, 50px) scale(1.1); }
}

.bg-grid {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(var(--stroke) 1px, transparent 1px),
    linear-gradient(90deg, var(--stroke) 1px, transparent 1px);
  background-size: 68px 68px;
  opacity: .5;
  -webkit-mask-image: radial-gradient(ellipse 90% 55% at 50% 0%, #000 15%, transparent 80%);
  mask-image: radial-gradient(ellipse 90% 55% at 50% 0%, #000 15%, transparent 80%);
}

.preloader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  background: var(--bg-0);
  opacity: 1;
  visibility: visible;
  transition: opacity .8s var(--ease), visibility .8s;
}

.preloader.done {
  opacity: 0;
  visibility: hidden;
}

.preloader-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.preloader-text {
  font-size: clamp(1.2rem, 3.4vw, 1.6rem);
  font-weight: 700;
  letter-spacing: -.02em;
  background: linear-gradient(90deg,
    var(--text) 0%,
    var(--violet) 40%,
    var(--teal) 60%,
    var(--text) 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: text-sweep 2s linear infinite;
}

@keyframes text-sweep {
  to { background-position: -200% 0; }
}

.preloader-bar {
  width: 180px;
  height: 3px;
  border-radius: 99px;
  overflow: hidden;
  background: var(--glass-hi);
  position: relative;
}

.preloader-bar::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--violet), var(--teal));
  transform-origin: left;
  animation: bar-run 1.4s var(--ease) infinite;
}

@keyframes bar-run {
  0%   { transform: scaleX(0) translateX(0); }
  50%  { transform: scaleX(.7) translateX(20%); }
  100% { transform: scaleX(1) translateX(120%); }
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 16px;
  height: 64px;
  padding: 0 clamp(16px, 4vw, 32px);
  transition: background .4s var(--ease),
              backdrop-filter .4s var(--ease),
              border-color .4s var(--ease);
  border-bottom: 1px solid transparent;
}

.topbar.stuck {
  background: rgba(7, 7, 15, .78);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  backdrop-filter: blur(18px) saturate(180%);
  border-bottom-color: var(--stroke);
}

[data-theme="light"] .topbar.stuck {
  background: rgba(244, 244, 238, .78);
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: .95rem;
  letter-spacing: -.01em;
  cursor: pointer;
  transition: opacity .3s var(--ease);
}

.topbar-brand:hover { opacity: .75; }

.brand-icon {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--violet), var(--teal));
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  box-shadow: 0 8px 24px -8px rgba(167, 139, 250, .7);
  transition: transform .5s var(--ease-b);
}

.topbar-brand:hover .brand-icon {
  transform: rotate(-10deg) scale(1.1);
}

.brand-label {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.brand-label small {
  font-size: .66rem;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text-3);
}

.topbar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--glass);
  border: 1px solid var(--stroke);
  color: var(--text-2);
  font-size: 1rem;
  transition: all .35s var(--ease);
}

.icon-btn:hover {
  color: var(--violet);
  border-color: var(--stroke-hi);
  transform: translateY(-2px);
  box-shadow: 0 8px 22px -10px rgba(167, 139, 250, .6);
}

.icon-btn:active {
  transform: translateY(0) scale(.92);
}

.page {
  max-width: 1040px;
  margin: 0 auto;
  padding: 24px clamp(16px, 4vw, 32px) 80px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.modes {
  display: flex;
  gap: 6px;
  padding: 5px;
  border-radius: 18px;
  background: var(--glass);
  border: 1px solid var(--stroke);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  overflow-x: auto;
  scrollbar-width: none;
  animation: fade-up .8s var(--ease) .05s both;
}

.modes::-webkit-scrollbar { display: none; }

.mode-btn {
  position: relative;
  flex: 1;
  min-width: 100px;
  padding: 12px 14px;
  border-radius: 13px;
  font-size: .84rem;
  font-weight: 600;
  color: var(--text-2);
  letter-spacing: .01em;
  white-space: nowrap;
  text-align: center;
  transition: color .35s var(--ease);
  isolation: isolate;
  overflow: hidden;
}

.mode-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--violet), var(--teal));
  opacity: 0;
  transform: scale(.9);
  transition: opacity .35s var(--ease), transform .45s var(--ease-b);
}

.mode-btn:hover {
  color: var(--text);
}

.mode-btn:hover::before {
  opacity: .12;
  transform: scale(1);
}

.mode-btn.active {
  color: #fff;
  box-shadow: 0 10px 28px -12px rgba(167, 139, 250, .8);
}

.mode-btn.active::before {
  opacity: 1;
  transform: scale(1);
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  animation: fade-up .8s var(--ease) .12s both;
}

.stat-card {
  position: relative;
  padding: 16px 18px;
  border-radius: 18px;
  background: var(--glass);
  border: 1px solid var(--stroke);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  overflow: hidden;
  transition: all .35s var(--ease);
}

.stat-card:hover {
  border-color: var(--stroke-hi);
  transform: translateY(-3px);
  box-shadow: 0 20px 40px -24px rgba(0, 0, 0, .9);
}

.stat-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--violet), var(--teal));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .5s var(--ease);
}

.stat-card:hover::before {
  transform: scaleX(1);
}

.stat-value {
  display: block;
  font-size: 1.55rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.03em;
  line-height: 1.15;
  transition: color .3s var(--ease);
}

.stat-card:nth-child(1) .stat-value { color: var(--text); }
.stat-card:nth-child(2) .stat-value { color: var(--violet); }
.stat-card:nth-child(3) .stat-value { color: var(--teal); }
.stat-card:nth-child(4) .stat-value { color: var(--pink); }

.stat-label {
  display: block;
  font-size: .66rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 2px;
}

.stat-value.bump {
  animation: bump .4s var(--ease-b);
}

@keyframes bump {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.14); }
  100% { transform: scale(1); }
}

.progress-bar {
  height: 4px;
  border-radius: 99px;
  background: var(--glass-hi);
  overflow: hidden;
  position: relative;
  animation: fade-up .8s var(--ease) .18s both;
}

.progress-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--violet), var(--teal), var(--pink));
  background-size: 200% 100%;
  width: 0%;
  transition: width .3s var(--ease);
  animation: prog-sweep 3s linear infinite;
  box-shadow: 0 0 20px rgba(167, 139, 250, .6);
}

@keyframes prog-sweep {
  to { background-position: 200% 0; }
}

.typing-card {
  position: relative;
  padding: clamp(28px, 4vw, 44px) clamp(24px, 4vw, 48px);
  min-height: 200px;
  border-radius: var(--r-lg);
  background: var(--glass);
  border: 1px solid var(--stroke);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  box-shadow: 0 40px 90px -60px rgba(0, 0, 0, 1);
  cursor: text;
  overflow: hidden;
  transition: border-color .4s var(--ease),
              box-shadow .4s var(--ease),
              transform .5s var(--ease);
  animation: fade-up .8s var(--ease) .24s both;
}

.typing-card:hover {
  border-color: var(--stroke-hi);
}

.typing-card.focused {
  border-color: rgba(167, 139, 250, .45);
  box-shadow:
    0 40px 90px -60px rgba(0, 0, 0, 1),
    0 0 0 3px rgba(167, 139, 250, .14);
}

.typing-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--r-lg);
  pointer-events: none;
  background: radial-gradient(
    600px circle at var(--mx, 50%) var(--my, 50%),
    rgba(167, 139, 250, .1),
    transparent 60%
  );
  opacity: 0;
  transition: opacity .45s var(--ease);
}

.typing-card:hover::before { opacity: 1; }

.focus-hint {
  position: absolute;
  top: 14px;
  right: 18px;
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-3);
  opacity: 0;
  transition: opacity .4s var(--ease);
  pointer-events: none;
}

.typing-card:not(.focused) .focus-hint {
  opacity: 1;
  animation: hint-pulse 2s var(--ease) infinite;
}

@keyframes hint-pulse {
  0%, 100% { opacity: .35; }
  50% { opacity: .9; }
}

.typing-text {
  font-family: "JetBrains Mono", "SF Mono", ui-monospace, "Cascadia Mono",
               "PingFang SC", "Microsoft YaHei", Menlo, Consolas, monospace;
  font-size: clamp(1.15rem, 2.6vw, 1.7rem);
  line-height: 1.95;
  letter-spacing: .01em;
  word-break: break-word;
  white-space: pre-wrap;
  word-wrap: break-word;
  user-select: none;
  -webkit-user-select: none;
  min-height: 4.5em;
  transition: opacity .3s var(--ease);
}

.typing-text.fading {
  opacity: 0;
}

.char {
  position: relative;
  color: var(--text-3);
  transition: color .16s var(--ease), background-color .16s var(--ease);
}

.char.correct {
  color: var(--teal);
}

.char.wrong {
  color: var(--err);
  background: rgba(248, 113, 113, .16);
  border-radius: 4px;
  animation: shake .3s var(--ease);
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-2px); }
  75% { transform: translateX(2px); }
}

.char.current {
  color: var(--text);
}

.char.current::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: .06em;
  height: 3px;
  border-radius: 3px;
  background: var(--violet);
  box-shadow: 0 0 12px var(--violet);
  animation: caret 1s var(--ease-i) infinite;
}

@keyframes caret {
  0%, 45% { opacity: 1; transform: scaleX(1); }
  55%, 100% { opacity: .1; transform: scaleX(.7); }
}

.typing-input {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: none;
  background: transparent;
  color: transparent;
  caret-color: transparent;
  outline: none;
  resize: none;
  font-size: 16px;
  opacity: 0;
  cursor: text;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  animation: fade-up .8s var(--ease) .3s both;
}

.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: 14px;
  font-size: .85rem;
  font-weight: 600;
  color: var(--text);
  background: var(--glass);
  border: 1px solid var(--stroke);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  transition: all .4s var(--ease);
}

.action-btn:hover {
  transform: translateY(-3px);
  border-color: var(--stroke-hi);
  background: var(--glass-hi);
  color: var(--violet);
  box-shadow: 0 14px 30px -14px rgba(167, 139, 250, .7);
}

.action-btn:active {
  transform: translateY(-1px) scale(.97);
}

.action-btn .key-hint {
  font-family: ui-monospace, monospace;
  font-size: .7rem;
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--glass-hi);
  color: var(--text-3);
  font-weight: 700;
}

.keyboard {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 18px;
  border-radius: 22px;
  background: var(--glass);
  border: 1px solid var(--stroke);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  overflow-x: auto;
  animation: fade-up .8s var(--ease) .36s both;
}

.keyboard::-webkit-scrollbar { display: none; }

.kb-row {
  display: flex;
  gap: 7px;
  justify-content: center;
  min-width: max-content;
}

.kb-key {
  min-width: 44px;
  height: 46px;
  padding: 0 12px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--glass-hi);
  border: 1px solid var(--stroke);
  font-size: .76rem;
  font-weight: 700;
  letter-spacing: .02em;
  color: var(--text-2);
  user-select: none;
  transition: all .16s var(--ease);
  flex-shrink: 0;
}

.kb-key.wide { min-width: 68px; }
.kb-key.wider { min-width: 92px; }
.kb-key.space { flex: 1; min-width: 220px; max-width: 400px; }

.kb-key.active {
  background: linear-gradient(135deg, var(--violet), var(--teal));
  color: #fff;
  border-color: transparent;
  transform: translateY(3px) scale(.96);
  box-shadow:
    0 0 24px rgba(167, 139, 250, .6),
    inset 0 0 12px rgba(255, 255, 255, .2);
}

.result-overlay {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(0, 0, 0, .68);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .4s var(--ease), visibility .4s;
}

.result-overlay.show {
  opacity: 1;
  visibility: visible;
}

.result-panel {
  width: min(460px, 100%);
  padding: 40px 32px 32px;
  border-radius: 28px;
  background: var(--bg-1);
  border: 1px solid var(--stroke-hi);
  box-shadow: 0 60px 120px -40px rgba(0, 0, 0, 1);
  text-align: center;
  transform: translateY(30px) scale(.94);
  transition: transform .5s var(--ease-b);
}

.result-overlay.show .result-panel {
  transform: none;
}

.result-badge {
  width: 78px;
  height: 78px;
  margin: 0 auto 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 2.2rem;
  background: linear-gradient(135deg, var(--violet), var(--teal));
  box-shadow: 0 22px 50px -16px rgba(167, 139, 250, .8);
  animation: badge-in .8s var(--ease-b);
}

@keyframes badge-in {
  0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
  60%  { transform: scale(1.18) rotate(10deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.result-title {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -.03em;
  margin-bottom: 4px;
}

.result-sub {
  font-size: .86rem;
  color: var(--text-3);
  margin-bottom: 26px;
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 28px;
}

.result-cell {
  padding: 16px 10px;
  border-radius: 16px;
  background: var(--glass);
  border: 1px solid var(--stroke);
  opacity: 0;
  transform: translateY(12px);
  animation: cell-in .5s var(--ease) forwards;
}

.result-cell:nth-child(1) { animation-delay: .15s; }
.result-cell:nth-child(2) { animation-delay: .24s; }
.result-cell:nth-child(3) { animation-delay: .33s; }

@keyframes cell-in {
  to { opacity: 1; transform: none; }
}

.result-cell b {
  display: block;
  font-size: 1.55rem;

      "The journey is the reward."

  var KB_LAYOUT = [
    ["`","1","2","3","4","5","6","7","8","9","0","-","=","backspace"],
    ["tab","q","w","e","r","t","y","u","i","o","p","[","]","\\"],
    ["caps","a","s","d","f","g","h","j","k","l",";","'","enter"],
    ["shift","z","x","c","v","b","n","m",",",".","/","shift"],
    ["space"]
  ];

  var KB_LABEL = {
    backspace: "⌫",
    tab: "Tab",
    caps: "Caps",
    enter: "↵",
    shift: "⇧",
    space: "Space"
  };

  var inputEl = $("typingInput");
  var textEl = $("typingText");
  var cardEl = $("typingCard");
  var progressFill = $("progressFill");

  var mode = "cn_words";
  var target = "";
  var startTime = null;
  var timerId = null;
  var finished = false;
  var started = false;
  var charSpans = [];

  var composing = false;
  var everWrong = {};
  var maxPos = 0;

  var lastStats = { time: "0.0", cpm: "0", acc: "100%", prog: "0%" };

  function randInt(max) { return Math.floor(Math.random() * max); }

  function pickMany(arr, n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push(arr[randInt(arr.length)]);
    return out;
  }

  function genText() {
    if (mode === "cn_words") return pickMany(DATA.cn_words, 12).join(" ");
    if (mode === "cn_sentences") return DATA.cn_sentences[randInt(DATA.cn_sentences.length)];
    if (mode === "en_words") return pickMany(DATA.en_words, 15).join(" ");
    if (mode === "en_sentences") return DATA.en_sentences[randInt(DATA.en_sentences.length)];
    return "";
  }

  function escapeHtml(ch) {
    if (ch === "<") return "&lt;";
    if (ch === ">") return "&gt;";
    if (ch === "&") return "&amp;";
    if (ch === " ") return "&nbsp;";
    return ch;
  }

  function setStat(el, val) {
    if (el.textContent === val) return;
    el.textContent = val;
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  function countWrong() {
    var n = 0;
    for (var k in everWrong) {
      if (everWrong.hasOwnProperty(k)) n++;
    }
    return n;
  }

  function buildText() {
    var html = "";
    for (var i = 0; i < target.length; i++) {
      html += '<span class="char">' + escapeHtml(target[i]) + "</span>";
    }
    textEl.innerHTML = html;
    charSpans = textEl.querySelectorAll(".char");
  }

  function render() {
    var val = inputEl.value;
    for (var i = 0; i < target.length; i++) {
      var span = charSpans[i];
      if (!span) continue;
      var cls = "char";
      if (i < val.length) {
        cls += val[i] === target[i] ? " correct" : " wrong";
      } else if (i === val.length) {
        cls += " current";
      }
      if (span.className !== cls) span.className = cls;
    }
  }

  function updateStats() {
    var val = inputEl.value;
    var elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;

    var correct = 0;
    var minLen = Math.min(val.length, target.length);
    for (var i = 0; i < minLen; i++) {
      if (val[i] === target[i]) correct++;
    }

    var cpm = elapsed > 0.3 ? Math.round(correct / elapsed * 60) : 0;
    var acc = maxPos > 0
      ? Math.round((maxPos - countWrong()) / maxPos * 100)
      : 100;
    if (acc < 0) acc = 0;
    var prog = target.length > 0 ? Math.min(val.length / target.length, 1) : 0;

    var timeStr = elapsed.toFixed(1);
    var cpmStr = String(cpm);
    var accStr = acc + "%";
    var progStr = Math.round(prog * 100) + "%";

    if (timeStr !== lastStats.time) { setStat($("statTime"), timeStr); lastStats.time = timeStr; }
    if (cpmStr !== lastStats.cpm)   { setStat($("statCpm"), cpmStr);  lastStats.cpm = cpmStr; }
    if (accStr !== lastStats.acc)   { setStat($("statAcc"), accStr);  lastStats.acc = accStr; }
    if (progStr !== lastStats.prog) { setStat($("statProg"), progStr); lastStats.prog = progStr; }

    progressFill.style.width = (prog * 100) + "%";
  }

  var keyMap = {};

  function buildKeyboard() {
    var kb = $("keyboard");
    kb.innerHTML = "";
    keyMap = {};

    for (var r = 0; r < KB_LAYOUT.length; r++) {
      var row = KB_LAYOUT[r];
      var rowEl = document.createElement("div");
      rowEl.className = "kb-row";
      for (var c = 0; c < row.length; c++) {
        var k = row[c];
        var keyEl = document.createElement("div");
        keyEl.className = "kb-key";
        if (k === "backspace" || k === "enter") keyEl.classList.add("wider");
        if (k === "tab" || k === "caps") keyEl.classList.add("wide");
        if (k === "shift") keyEl.classList.add("wider");
        if (k === "space") keyEl.classList.add("space");
        keyEl.setAttribute("data-key", k);
        keyEl.textContent = KB_LABEL[k] || k.toUpperCase();
        rowEl.appendChild(keyEl);
        if (!keyMap[k]) keyMap[k] = [];
        keyMap[k].push(keyEl);
      }
      kb.appendChild(rowEl);
    }
  }

  function flashKey(ch) {
    var active = document.querySelectorAll(".kb-key.active");
    for (var i = 0; i < active.length; i++) active[i].classList.remove("active");
    if (!ch) return;
    var name = ch === " " ? "space" : ch.toLowerCase();
    var keys = keyMap[name];
    if (keys) {
      for (var j = 0; j < keys.length; j++) {
        (function (k) {
          k.classList.add("active");
          clearTimeout(k._t);
          k._t = setTimeout(function () { k.classList.remove("active"); }, 160);
        })(keys[j]);
      }
    }
    if (/[A-Z]/.test(ch)) {
      var shifts = keyMap["shift"] || [];
      for (var s = 0; s < shifts.length; s++) {
        (function (k) {
          k.classList.add("active");
          clearTimeout(k._t);
          k._t = setTimeout(function () { k.classList.remove("active"); }, 160);
        })(shifts[s]);
      }
    }
  }

  function handleInput() {
    if (finished) return;

    if (inputEl.value.length > target.length) {
      inputEl.value = inputEl.value.slice(0, target.length);
    }

    var val = inputEl.value;

    if (val.length > maxPos) maxPos = val.length;

    for (var i = 0; i < val.length; i++) {
      if (val[i] !== target[i]) everWrong[i] = true;
    }

    if (!started && val.length > 0) {
      started = true;
      startTime = Date.now();
      timerId = setInterval(updateStats, 100);
    }

    render();
    updateStats();

    var last = val.slice(-1);
    if (last) flashKey(last);

    if (val.length >= target.length) finish();
  }

  function newRound() {
    if (timerId) { clearInterval(timerId); timerId = null; }

    target = genText();
    inputEl.value = "";
    startTime = null;
    started = false;
    finished = false;
    composing = false;
    everWrong = {};
    maxPos = 0;
    lastStats = { time: "0.0", cpm: "0", acc: "100%", prog: "0%" };

    $("resultOverlay").classList.remove("show");

    textEl.classList.add("fading");
    setTimeout(function () {
      buildText();
      render();
      updateStats();
      progressFill.style.width = "0%";
      textEl.classList.remove("fading");
    }, 140);

    $("statTime").textContent = "0.0";
    $("statCpm").textContent = "0";
    $("statAcc").textContent = "100%";
    $("statProg").textContent = "0%";

    if (!window.matchMedia("(hover: none)").matches) {
      inputEl.focus();
    }
  }

  function finish() {
    if (finished) return;
    finished = true;
    if (timerId) { clearInterval(timerId); timerId = null; }

    var elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
    var val = inputEl.value;
    var correct = 0;
    var minLen = Math.min(val.length, target.length);
    for (var i = 0; i < minLen; i++) {
      if (val[i] === target[i]) correct++;
    }
    var cpm = elapsed > 0.3 ? Math.round(correct / elapsed * 60) : 0;
    var acc = maxPos > 0
      ? Math.round((maxPos - countWrong()) / maxPos * 100)
      : 100;
    if (acc < 0) acc = 0;

    var sub = "继续保持节奏";
    if (cpm >= 400) sub = "🔥 手速惊人，可以去打比赛了";
    else if (cpm >= 260) sub = "⚡ 速度很快，节奏很稳";
    else if (cpm >= 160) sub = "✨ 已经不错了，再来一轮";
    else if (cpm >= 80) sub = "🌱 稳扎稳打，继续加油";
    else sub = "🐢 慢一点没关系，准确更重要";

    $("resCpm").textContent = cpm;
    $("resAcc").textContent = acc + "%";
    $("resTime").textContent = elapsed.toFixed(1) + "s";
    $("resultSub").textContent = sub;

    setTimeout(function () {
      $("resultOverlay").classList.add("show");
    }, 280);
  }

  inputEl.addEventListener("compositionstart", function () {
    composing = true;
  });

  inputEl.addEventListener("compositionend", function () {
    composing = false;
    handleInput();
  });

  inputEl.addEventListener("input", function (e) {
    if (composing) return;
    if (e.isComposing) return;
    if (e.inputType === "insertCompositionText") return;
    handleInput();
  });

  inputEl.addEventListener("focus", function () { cardEl.classList.add("focused"); });
  inputEl.addEventListener("blur", function () { cardEl.classList.remove("focused"); });

  cardEl.addEventListener("click", function () { inputEl.focus(); });

  cardEl.addEventListener("mousemove", function (e) {
    var r = cardEl.getBoundingClientRect();
    cardEl.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100) + "%");
    cardEl.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100) + "%");
  });

  var modeBtns = document.querySelectorAll(".mode-btn");
  for (var i = 0; i < modeBtns.length; i++) {
    modeBtns[i].addEventListener("click", function () {
      var btns = document.querySelectorAll(".mode-btn");
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove("active");
      this.classList.add("active");
      mode = this.getAttribute("data-mode");
      newRound();
    });
  }

  $("restartBtn").addEventListener("click", newRound);
  $("nextBtn").addEventListener("click", newRound);
  $("againBtn").addEventListener("click", newRound);
  $("nextRoundBtn").addEventListener("click", newRound);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Tab") { e.preventDefault(); newRound(); }
    else if (e.key === "Escape") { e.preventDefault(); newRound(); }
  });

  var savedTheme = localStorage.getItem("mu-theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

  $("themeBtn").addEventListener("click", function () {
    var current = document.documentElement.getAttribute("data-theme");
    var next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("mu-theme", next);
  });

  $("brandBtn").addEventListener("click", function () { location.href = "index.html"; });

  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function () {
        $("topbar").classList.toggle("stuck", window.scrollY > 12);
        ticking = false;
      });
    }
  }, { passive: true });

  function init() {
    buildKeyboard();
    newRound();
    setTimeout(function () {
      $("preloader").classList.add("done");
    }, 600);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
